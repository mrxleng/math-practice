<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20以内加减法打卡练习</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    color: #eee;
  }
  header {
    padding: 12px 16px;
    background: #16213e;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
  }
  #timer {
    margin: 8px 0 0;
    text-align: center;
    font-size: 40px;
    font-weight: 800;
    color: #e94560;
    font-variant-numeric: tabular-nums;
  }
  #stats { margin: 0 0 8px; text-align: center; color: #b7ebc2; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  #question {
    margin: 8px 0;
    min-height: 72px;
    font-size: clamp(40px, 12vw, 64px);
    font-weight: 800;
    text-align: center;
  }
  #heard, #result { margin: 4px 0; min-height: 24px; text-align: center; }
  #heard { color: #bbb; }
  .correct { color: #4caf50; }
  .wrong { color: #f44336; }
  #listen-dot {
    display: none;
    width: 14px; height: 14px;
    margin: 6px auto 0;
    border-radius: 50%;
    background: #4caf50;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .5; } }
  #mic-meter-wrap { display: none; width: min(320px, 80vw); margin: 8px auto 0; }
  #mic-meter { height: 12px; background: #0f3460; border-radius: 6px; overflow: hidden; }
  #mic-meter-fill { height: 100%; width: 0%; background: #4caf50; transition: width .08s linear; }
  #mode-banner {
    display: none;
    max-width: 640px;
    margin: 8px auto 0;
    padding: 10px 12px;
    border-radius: 10px;
    background: #53350a;
    color: #ffd58a;
    font-size: 15px;
    line-height: 1.5;
    text-align: center;
  }
  #input-area { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  input {
    font-size: 28px;
    width: 160px;
    text-align: center;
    padding: 10px;
    border: 2px solid #0f3460;
    border-radius: 10px;
    background: #0f3460;
    color: #fff;
  }
  #numpad {
    display: none;
    max-width: 420px;
    margin: 12px auto 0;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  #numpad button {
    font-size: 20px;
    min-height: 44px;
    padding: 6px 0;
    margin: 0;
    background: #0f3460;
  }
  #controls {
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    text-align: center;
    background: #16213e;
  }
  button {
    font-size: 18px;
    min-height: 48px;
    padding: 12px 18px;
    margin: 4px;
    border: 0;
    border-radius: 10px;
    background: #e94560;
    color: #fff;
    font-weight: 700;
  }
  #voice-toggle, #mic-toggle, #submit-btn, #restart-btn, #relisten-btn, #mic-test-btn { background: #0f3460; }
  .tip {
    max-width: 640px;
    margin: 8px auto 0;
    color: #c8c8d8;
    font-size: 14px;
    line-height: 1.5;
  }
  #end-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: #1a1a2e;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .big-score { margin: 8px 0; font-size: 64px; color: #4caf50; font-weight: 800; }
</style>
</head>
<body>
<header>20以内加减法 · 5分钟</header>
<div id="timer">05:00</div>
<div id="stats">答对 0 题</div>
<main>
  <div id="question">准备开始</div>
  <div id="listen-dot"></div>
  <div id="mic-meter-wrap"><div id="mic-meter"><div id="mic-meter-fill"></div></div></div>
  <div id="heard"></div>
  <div id="result"></div>
  <div id="mode-banner"></div>
  <div id="input-area">
    <input id="answer" inputmode="numeric" autocomplete="off" placeholder="输入答案" disabled>
    <button id="submit-btn" type="button" disabled>提交</button>
  </div>
  <div id="numpad"></div>
</main>
<div id="controls">
  <button id="voice-toggle" type="button">语音播报：开</button>
  <button id="mic-toggle" type="button">麦克风答题：开</button>
  <button id="mic-test-btn" type="button">测试麦克风</button><br>
  <button id="start-btn" type="button">开始练习</button>
  <button id="stop-btn" type="button" style="display:none;">结束练习</button>
  <button id="relisten-btn" type="button" style="display:none;">重新收音</button>
  <div class="tip">说对自动下一题，说错不跳题、不加分。v2 说明：开始时先拿到麦克风权限再收音；如果浏览器自带的在线语音识别连不上（国内网络/国产手机常见），页面会自动切换到「手机语音输入」模式：点答案框、用键盘自带的麦克风说话，输入后自动判题；也可以直接点数字答题。本页不保存录音，也不请求摄像头。</div>
</div>
<div id="end-screen">
  <h2>练习结束</h2>
  <div class="big-score" id="big-score">0</div>
  <p id="final-stats">答对 0 题</p>
  <p id="final-note">已停止收音和计分。</p>
  <button id="restart-btn" type="button">再练一次</button>
</div>
<script>
/* PARSE_START */
function parseSpokenNumber(text) {
  if (text == null) return null;
  var s = String(text).replace(/\s+/g, '');
  s = s.replace(/[０-９]/g, function (ch) {
    return String.fromCharCode(ch.charCodeAt(0) - 0xFF10 + 48);
  });
  s = s.replace(/[，。！？、,.!?;:；：]/g, '');
  var words = [
    ['二十', 20], ['十九', 19], ['十八', 18], ['十七', 17], ['十六', 16],
    ['十五', 15], ['十四', 14], ['十三', 13], ['十二', 12], ['十一', 11],
    ['十', 10], ['九', 9], ['八', 8], ['七', 7], ['六', 6], ['五', 5],
    ['四', 4], ['三', 3], ['两', 2], ['二', 2], ['一', 1], ['零', 0], ['〇', 0]
  ];
  var values = [];
  var i = 0;
  while (i < s.length) {
    var rest = s.slice(i);
    var digit = /^\d+/.exec(rest);
    if (digit) {
      values.push(parseInt(digit[0], 10));
      i += digit[0].length;
      continue;
    }
    var found = false;
    for (var w = 0; w < words.length; w++) {
      if (rest.indexOf(words[w][0]) === 0) {
        values.push(words[w][1]);
        i += words[w][0].length;
        found = true;
        break;
      }
    }
    if (!found) i += 1;
  }
  if (!values.length) return null;
  for (var k = 0; k < values.length; k++) {
    if (values[k] !== values[0] || values[k] < 0 || values[k] > 20) return null;
  }
  return values[0];
}
/* PARSE_END */

var DURATION_MS = 300000;
var running = false;
var ended = false;
var speaking = false;
var busy = false;
var voiceEnabled = true;
var micEnabled = true;
var blockRestart = false;
var networkErrors = 0;
var softErrors = 0;
var correct = 0;
var currentAnswer = null;
var deadline = 0;
var listenGen = 0;
var speakGen = 0;
var recognition = null;
var restartTimer = null;
var timerHandle = null;
var engineMode = 'web'; /* web = 浏览器在线识别; ime = 手机系统语音输入/数字 */
var micPrimed = false;
var inputDebounce = null;
var lastErrorWasNetwork = false;

var timerEl = document.getElementById('timer');
var statsEl = document.getElementById('stats');
var questionEl = document.getElementById('question');
var heardEl = document.getElementById('heard');
var resultEl = document.getElementById('result');
var answerInput = document.getElementById('answer');
var startBtn = document.getElementById('start-btn');
var stopBtn = document.getElementById('stop-btn');
var submitBtn = document.getElementById('submit-btn');
var relistenBtn = document.getElementById('relisten-btn');
var voiceToggle = document.getElementById('voice-toggle');
var micToggle = document.getElementById('mic-toggle');
var micTestBtn = document.getElementById('mic-test-btn');
var listenDot = document.getElementById('listen-dot');
var bannerEl = document.getElementById('mode-banner');
var numpadEl = document.getElementById('numpad');
var endScreen = document.getElementById('end-screen');
var bigScore = document.getElementById('big-score');
var finalStats = document.getElementById('final-stats');
var finalNote = document.getElementById('final-note');

/* 数字答题盘（兜底模式用） */
(function buildNumpad() {
  for (var n = 0; n <= 20; n++) {
    (function (v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = String(v);
      b.onclick = function () { judge(v, false); };
      numpadEl.appendChild(b);
    })(n);
  }
})();

function formatLeft(ms) {
  var sec = Math.max(0, Math.ceil(ms / 1000));
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function updateScore() {
  statsEl.textContent = '答对 ' + correct + ' 题';
}

function showBanner(text) {
  if (text) {
    bannerEl.textContent = text;
    bannerEl.style.display = 'block';
  } else {
    bannerEl.textContent = '';
    bannerEl.style.display = 'none';
  }
}

function stopListening() {
  if (restartTimer) {
    clearTimeout(restartTimer);
    restartTimer = null;
  }
  listenGen += 1;
  listenDot.style.display = 'none';
  var rec = recognition;
  recognition = null;
  if (!rec) return;
  rec.onresult = null;
  rec.onerror = null;
  rec.onend = null;
  rec.onstart = null;
  try { rec.abort(); } catch (e) {}
}

function stopSpeaking() {
  speakGen += 1;
  speaking = false;
  if (window.speechSynthesis) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
}

function speakThen(text, done) {
  var gen = ++speakGen;
  var settled = false;
  stopListening();
  function finish() {
    if (gen !== speakGen || settled) return;
    settled = true;
    clearTimeout(watch);
    speaking = false;
    /* 安卓 Chrome 的 onend 可能早于声音真正播完，留一点间隔再开麦，避免把播报声当答案收进去 */
    setTimeout(done, 350);
  }
  if (!voiceEnabled || !window.speechSynthesis || !text) {
    finish();
    return;
  }
  speaking = true;
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  utter.rate = 0.95;
  utter.onend = finish;
  utter.onerror = finish;
  var watch = setTimeout(finish, Math.min(8000, 800 + String(text).length * 220));
  try {
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  } catch (e) {
    finish();
  }
}

/* 先用 getUserMedia 把麦克风权限拿到手，再启动识别。
   v1 直接启动识别，权限弹窗/授权竞态在安卓 Chrome 上会让识别以 network/无结果失败。 */
function primeMic(done) {
  if (micPrimed || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    done(true);
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    stream.getTracks().forEach(function (t) { t.stop(); });
    micPrimed = true;
    done(true);
  }).catch(function () {
    done(false);
  });
}

function switchToImeMode(reason) {
  if (engineMode === 'ime') return;
  engineMode = 'ime';
  blockRestart = true;
  stopListening();
  showBanner('浏览器自带的在线语音识别连不上（' + reason + '），已切换到手机语音输入模式：点下面的答案框 → 点键盘上的麦克风按钮 → 说出答案，输入后会自动判题、答对自动下一题。也可以直接点数字答题。');
  numpadEl.style.display = 'grid';
  relistenBtn.style.display = 'none';
  heardEl.textContent = '当前：手机语音输入模式';
  try { answerInput.focus(); } catch (e) {}
}

function scheduleListen() {
  if (restartTimer) clearTimeout(restartTimer);
  var delay = lastErrorWasNetwork ? 1200 : 500;
  restartTimer = setTimeout(function () {
    restartTimer = null;
    startListening();
  }, delay);
}

function startListening() {
  if (!running || speaking || busy || !micEnabled || blockRestart || ended) return;
  if (engineMode !== 'web') return;
  var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) {
    switchToImeMode('这个浏览器没有在线语音识别');
    return;
  }
  if (restartTimer) {
    clearTimeout(restartTimer);
    restartTimer = null;
  }
  var oldRec = recognition;
  recognition = null;
  if (oldRec) {
    oldRec.onresult = null;
    oldRec.onerror = null;
    oldRec.onend = null;
    oldRec.onstart = null;
    try { oldRec.abort(); } catch (e1) {}
  }
  var gen = ++listenGen;
  var rec = new Ctor();
  recognition = rec;
  rec.lang = 'zh-CN';
  try { rec.continuous = false; } catch (e2) {}
  /* 只取最终结果：中间结果在安卓上容易误判，也更容易触发识别服务异常 */
  try { rec.interimResults = false; } catch (e3) {}
  try { rec.maxAlternatives = 5; } catch (e4) {}
  rec.onstart = function () {
    if (gen !== listenGen) return;
    listenDot.style.display = 'block';
    heardEl.textContent = '正在听…请说答案';
  };
  rec.onresult = function (event) {
    if (gen !== listenGen || !running || speaking || busy) return;
    networkErrors = 0;
    softErrors = 0;
    lastErrorWasNetwork = false;
    var preview = '';
    var firstNum = null;
    for (var i = event.resultIndex; i < event.results.length; i++) {
      var result = event.results[i];
      if (!result) continue;
      if (result[0]) preview += result[0].transcript;
      for (var j = 0; j < result.length; j++) {
        var parsed = parseSpokenNumber(result[j].transcript);
        if (parsed === null) continue;
        if (parsed === currentAnswer) {
          heardEl.textContent = '听到：' + result[j].transcript;
          judge(parsed, true);
          return;
        }
        if (firstNum === null) firstNum = parsed;
      }
    }
    heardEl.textContent = preview ? '听到：' + preview : '正在听…请说答案';
    if (firstNum === null) {
      resultEl.textContent = '没听清，请再说一次。';
      resultEl.className = 'wrong';
      return;
    }
    judge(firstNum, true);
  };
  rec.onerror = function (event) {
    if (gen !== listenGen) return;
    listenDot.style.display = 'none';
    var code = event && event.error;
    lastErrorWasNetwork = (code === 'network');
    if (code === 'not-allowed' || code === 'service-not-allowed') {
      blockRestart = true;
      heardEl.textContent = '麦克风权限被拒绝。请在浏览器设置里允许麦克风后，点「重新收音」。';
      relistenBtn.style.display = 'inline-block';
    } else if (code === 'network') {
      networkErrors += 1;
      if (networkErrors >= 2) {
        /* v1 要失败 5 次才停，近 40 秒就这么烧掉了；2 次就判定服务不可达并切模式 */
        switchToImeMode('在线识别服务连不上');
      } else {
        heardEl.textContent = '识别服务连接不稳，正在重试一次…';
      }
    } else if (code === 'audio-capture') {
      blockRestart = true;
      heardEl.textContent = '找不到麦克风。请检查设备后点「重新收音」。';
      relistenBtn.style.display = 'inline-block';
    } else if (code === 'no-speech' || code === 'aborted') {
      softErrors += 1;
      heardEl.textContent = '没听到声音，请再说一次。';
    }
  };
  rec.onend = function () {
    if (gen !== listenGen) return;
    listenDot.style.display = 'none';
    if (recognition === rec) recognition = null;
    if (blockRestart || !running || speaking || busy || !micEnabled || ended) return;
    if (engineMode !== 'web') return;
    scheduleListen();
  };
  try {
    rec.start();
  } catch (e) {
    heardEl.textContent = '语音识别启动失败，正在重试…';
    scheduleListen();
  }
}

function makeQuestion() {
  if (Math.random() < 0.5) {
    var a = Math.floor(Math.random() * 21);
    var b = Math.floor(Math.random() * (21 - a));
    return { display: a + ' + ' + b + ' = ?', say: a + '加' + b + '等于几', answer: a + b };
  }
  var a2 = Math.floor(Math.random() * 21);
  var b2 = Math.floor(Math.random() * (a2 + 1));
  return { display: a2 + ' - ' + b2 + ' = ?', say: a2 + '减' + b2 + '等于几', answer: a2 - b2 };
}

function generateQuestion(prefixCorrect) {
  var q = makeQuestion();
  currentAnswer = q.answer;
  questionEl.textContent = q.display;
  answerInput.value = '';
  resultEl.textContent = '';
  resultEl.className = '';
  busy = true;
  speakThen((prefixCorrect ? '正确。' : '') + q.say, function () {
    busy = false;
    if (!running || ended) return;
    if (engineMode === 'web') {
      startListening();
    } else {
      try { answerInput.focus(); } catch (e) {}
    }
  });
}

function timeUp() {
  return deadline > 0 && Date.now() >= deadline;
}

function judge(num, fromVoice) {
  if (!running || ended || busy) return;
  if (fromVoice && speaking) return;
  if (timeUp()) {
    finish('time');
    return;
  }
  if (num === null || num !== currentAnswer) {
    resultEl.textContent = num === null ? '请输入 0 到 20 的整数。' : '不对，再试一次。';
    resultEl.className = 'wrong';
    answerInput.value = '';
    return;
  }
  busy = true;
  correct += 1;
  networkErrors = 0;
  updateScore();
  resultEl.textContent = '正确';
  resultEl.className = 'correct';
  stopListening();
  stopSpeaking();
  if (timeUp()) {
    busy = false;
    finish('time');
    return;
  }
  generateQuestion(true);
}

function tick() {
  if (!running || ended) return;
  var left = deadline - Date.now();
  if (left <= 0) {
    timerEl.textContent = '00:00';
    finish('time');
    return;
  }
  timerEl.textContent = formatLeft(left);
  timerHandle = setTimeout(tick, Math.min(200, left));
}

function finish(reason) {
  if (ended) return;
  ended = true;
  running = false;
  busy = false;
  stopSpeaking();
  stopListening();
  if (timerHandle) clearTimeout(timerHandle);
  timerEl.textContent = reason === 'time' ? '00:00' : timerEl.textContent;
  answerInput.disabled = true;
  submitBtn.disabled = true;
  submitBtn.style.display = 'none';
  stopBtn.style.display = 'none';
  relistenBtn.style.display = 'none';
  endScreen.style.display = 'flex';
  bigScore.textContent = String(correct);
  finalStats.textContent = '答对 ' + correct + ' 题';
  finalNote.textContent = reason === 'stop' ? '练习已停止，不再收音，也不再计分。' : '5 分钟到了，已停止收音和计分。';
}

function startPractice() {
  if (running) return;
  engineMode = 'web';
  showBanner('');
  numpadEl.style.display = 'none';
  primeMic(function (ok) {
    if (!ok) {
      showBanner('没有拿到麦克风权限，先用手机语音输入/数字答题模式练习。请点答案框，用键盘麦克风说话，输入后自动判题。');
      engineMode = 'ime';
      numpadEl.style.display = 'grid';
    }
    running = true;
    ended = false;
    busy = false;
    blockRestart = (engineMode === 'ime');
    networkErrors = 0;
    softErrors = 0;
    correct = 0;
    currentAnswer = null;
    updateScore();
    deadline = Date.now() + DURATION_MS;
    timerEl.textContent = '05:00';
    startBtn.style.display = 'none';
    micTestBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';
    submitBtn.style.display = 'inline-block';
    answerInput.disabled = false;
    submitBtn.disabled = false;
    endScreen.style.display = 'none';
    relistenBtn.style.display = 'none';
    if (timerHandle) clearTimeout(timerHandle);
    tick();
    generateQuestion(false);
  });
}

function resetReady() {
  ended = false;
  running = false;
  busy = false;
  blockRestart = false;
  networkErrors = 0;
  softErrors = 0;
  correct = 0;
  currentAnswer = null;
  deadline = 0;
  engineMode = 'web';
  showBanner('');
  numpadEl.style.display = 'none';
  stopSpeaking();
  stopListening();
  if (timerHandle) clearTimeout(timerHandle);
  updateScore();
  timerEl.textContent = '05:00';
  questionEl.textContent = '准备开始';
  heardEl.textContent = '';
  resultEl.textContent = '';
  resultEl.className = '';
  answerInput.value = '';
  answerInput.disabled = true;
  submitBtn.disabled = true;
  submitBtn.style.display = 'none';
  stopBtn.style.display = 'none';
  relistenBtn.style.display = 'none';
  startBtn.style.display = 'inline-block';
  micTestBtn.style.display = 'inline-block';
  endScreen.style.display = 'none';
}

/* 麦克风自检：只测能不能录到声音（电平条会动），不经过在线识别服务 */
var testStream = null, testCtx = null, testRaf = null;
function stopMicTest() {
  if (testRaf) cancelAnimationFrame(testRaf);
  testRaf = null;
  if (testStream) testStream.getTracks().forEach(function (t) { t.stop(); });
  testStream = null;
  if (testCtx) { try { testCtx.close(); } catch (e) {} }
  testCtx = null;
  document.getElementById('mic-meter-wrap').style.display = 'none';
  micTestBtn.textContent = '测试麦克风';
}
micTestBtn.onclick = function () {
  if (testStream) { stopMicTest(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    heardEl.textContent = '这个浏览器不支持麦克风检测。';
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    testStream = stream;
    micPrimed = true;
    var wrap = document.getElementById('mic-meter-wrap');
    var fill = document.getElementById('mic-meter-fill');
    wrap.style.display = 'block';
    micTestBtn.textContent = '停止测试';
    heardEl.textContent = '麦克风测试中：说话时绿条会动，动了就说明能录到声音。再点一次停止。';
    var AC = window.AudioContext || window.webkitAudioContext;
    testCtx = new AC();
    var src = testCtx.createMediaStreamSource(stream);
    var analyser = testCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    var data = new Uint8Array(analyser.frequencyBinCount);
    (function loop() {
      analyser.getByteTimeDomainData(data);
      var peak = 0;
      for (var i = 0; i < data.length; i++) {
        var v = Math.abs(data[i] - 128) / 128;
        if (v > peak) peak = v;
      }
      fill.style.width = Math.min(100, Math.round(peak * 140)) + '%';
      testRaf = requestAnimationFrame(loop);
    })();
  }).catch(function () {
    heardEl.textContent = '麦克风权限被拒绝，无法测试。请在浏览器设置里允许麦克风。';
  });
};

voiceToggle.onclick = function () {
  voiceEnabled = !voiceEnabled;
  voiceToggle.textContent = voiceEnabled ? '语音播报：开' : '语音播报：关';
  if (!voiceEnabled) stopSpeaking();
};

micToggle.onclick = function () {
  micEnabled = !micEnabled;
  micToggle.textContent = micEnabled ? '麦克风答题：开' : '麦克风答题：关';
  if (!micEnabled) stopListening();
  else if (running && !speaking && !busy && !ended && engineMode === 'web') startListening();
};

startBtn.onclick = startPractice;
stopBtn.onclick = function () { finish('stop'); };
relistenBtn.onclick = function () {
  if (!running || ended) return;
  blockRestart = false;
  networkErrors = 0;
  relistenBtn.style.display = 'none';
  startListening();
};
submitBtn.onclick = function () {
  var n = parseSpokenNumber(answerInput.value);
  judge(n, false);
};
/* 手机语音输入/手动输入：内容稳定 600ms 后自动判题，不用再点提交 */
answerInput.addEventListener('input', function () {
  if (!running || ended) return;
  if (inputDebounce) clearTimeout(inputDebounce);
  inputDebounce = setTimeout(function () {
    inputDebounce = null;
    if (!running || ended || busy) return;
    var raw = answerInput.value;
    if (!raw || !String(raw).trim()) return;
    var n = parseSpokenNumber(raw);
    if (n !== null) judge(n, false);
  }, 600);
});
answerInput.onkeydown = function (e) {
  if (e.key === 'Enter') submitBtn.onclick();
};
document.getElementById('restart-btn').onclick = resetReady;
</script>
</body>
</html>
